[package]
name = "embassy-ra"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"

[dependencies]
embassy-sync = { path = "../embassy-sync" }
embassy-executor = { path = "../embassy-executor" }
embassy-time = { path = "../embassy-time" }
embassy-time-driver = { path = "../embassy-time-driver" }
embassy-time-queue-utils = { path = "../embassy-time-queue-utils" }
embassy-hal-internal = { path = "../embassy-hal-internal", features = ["cortex-m", "prio-bits-3"] }
ra-metapac = { path = "../../ra-data/build/ra-metapac", features = ["metadata", "embassy"] }
cortex-m = "0.7.7"
cortex-m-rt = "0.7.3"
critical-section = "1.1"
log = "0.4"
cfg-if = "1.0"
paste = "1.0"
defmt = { version = "0.3", optional = true }
defmt-rtt = { version = "0.4", optional = true }
panic-probe = { version = "0.3", features = ["print-defmt"], optional = true }

[build-dependencies]
ra-metapac = { path = "../../ra-data/build/ra-metapac", features = ["metadata"] }

embedded-hal = "1.0"
embedded-hal-async = "1.0"
embedded-hal-nb = "1.0"
embedded-io = "0.6"
embedded-io-async = "0.6"
defmt = { version = "0.3", optional = true }
log = { version = "0.4", optional = true }
critical-section = "1.1"

[features]
default = ["rt"]
rt = ["ra-metapac/rt"]
_time-driver = []
defmt = ["dep:defmt", "embassy-sync/defmt", "embassy-time/defmt", "ra-metapac/defmt"]
log = ["dep:log"]

