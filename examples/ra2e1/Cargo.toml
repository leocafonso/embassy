[package]
name = "embassy-ra2e1-examples"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
publish = false

[dependencies]
embassy-ra = { version = "0.1.0", path = "../../embassy-ra", features = ["r7fa2e1a92dfm", "defmt", "time-driver-agt0", "gpio", "hoco-24mhz"] }
embassy-executor = { version = "0.10.0", path = "../../embassy-executor", features = ["platform-cortex-m", "executor-thread", "defmt"] }
embassy-time = { version = "0.5.1", path = "../../embassy-time", features = ["defmt", "tick-hz-32_768"] }

cortex-m = { version = "0.7.7", features = ["inline-asm", "critical-section-single-core"] }
cortex-m-rt = "0.7.3"
critical-section = { version = "1.1" }
defmt = "0.3"
defmt-rtt = "0.4"
panic-probe = { version = "0.3", features = ["print-defmt"] }

[profile.release]
debug = 2
lto = true
opt-level = "s"

[package.metadata.embassy]
build = [
  { target = "thumbv8m.base-none-eabi", artifact-dir = "out/examples/ra2e1" }
]
