[target.'cfg(all(target_arch = "arm", target_os = "none"))']
runner = "probe-rs run --chip R7FA8M1AH --chip-description-path ../../../probe-rs/probe-rs/targets/RA8M1_Series.yaml"

[target.thumbv8m.main-none-eabihf]
rustflags = [
  "-C", "link-arg=-Tlink.x",
  "-C", "link-arg=-Tdefmt.x",
  "-L.",
]

[build]
target = "thumbv8m.main-none-eabihf"

[env]
DEFMT_LOG = "trace"
