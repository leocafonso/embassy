[package]
name = "embassy-ra-example"
version = "0.1.0"
edition = "2021"

[dependencies]
embassy-ra = { path = "../../embassy-ra", features = ["r7fa6e2bb3cfm", "defmt"] }
embassy-executor = { path = "../../embassy-executor", features = ["arch-cortex-m", "executor-thread", "defmt"] }
embassy-time = { path = "../../embassy-time", features = ["defmt", "tick-hz-8_000_000"] }

cortex-m = { version = "0.7.7", features = ["inline-asm", "critical-section-single-core"] }
cortex-m-rt = "0.7.3"
critical-section = { version = "1.1" }
defmt = "0.3"
defmt-rtt = "0.4"
panic-probe = { version = "0.3", features = ["print-defmt"] }

[profile.release]
debug = 2
lto = true
opt-level = "s"
